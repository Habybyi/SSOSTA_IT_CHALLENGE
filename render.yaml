databases:
  - name: custodia-db
    plan: free
    region: frankfurt
    databaseName: custodia
    user: custodia

services:
  - type: web
    name: custodia-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: npm run start:render
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: custodia-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: INBOUND_EMAIL_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "2"
      - key: APP_TIMEZONE
        value: Europe/Bratislava
      - key: DEMO_ONLY_IF_EMPTY
        value: "true"
      - key: SEED_OWNER_EMAIL
        value: milan.kovac@custodia.sk
      - key: SEED_OWNER_PASSWORD
        sync: false
      - key: APP_URL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
